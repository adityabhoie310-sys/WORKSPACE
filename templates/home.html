<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FWI Prediction</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .container {
            width: 450px;
            max-width: 90%;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin: 7px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            text-align: center;
            background: #e8f5e9;
            border-radius: 5px;
        }

        .result h2 {
            margin: 0;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🔥 FWI Prediction</h1>

        <form action="{{ url_for('predict_datapoint') }}" method="POST">
             <input
                type="number"
                step="any"
                name="Temperature"
                placeholder="Temperature"
                required
            >

            <input
                type="number"
                step="any"
                name="RH"
                placeholder="Relative Humidity (RH)"
                required
            >

            <input
                type="number"
                step="any"
                name="Ws"
                placeholder="Wind Speed (Ws)"
                required
            >

            <input
                type="number"
                step="any"
                name="Rain"
                placeholder="Rain"
                required
            >

            <input
                type="number"
                step="any"
                name="FFMC"
                placeholder="FFMC"
                required
            >

            <input
                type="number"
                step="any"
                name="DMC"
                placeholder="DMC"
                required
            >

            <input
                type="number"
                step="any"
                name="ISI"
                placeholder="ISI"
                required
            >

            <select name="Classes" required>
                <option value="">Select Classes</option>
                <option value="1">Fire</option>
                <option value="0">Not Fire</option>
            </select>

            <select name="Region" required>
                <option value="">Select Region</option>
                <option value="0">Region 0</option>
                <option value="1">Region 1</option>
            </select>

            <button type="submit">
                Predict FWI
            </button>

        </form>


        {% if error is defined %}

        <div class="result" role="alert">
            <h2>{{ error }}</h2>
        </div>

        {% endif %}

        {% if result is defined %}

        <div class="result">

            <h2>
                🔥 Predicted FWI: {{ result }}
            </h2>

        </div>

        {% endif %}

    </div>

</body>

</html>
